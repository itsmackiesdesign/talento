name: talento-product

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  ENV: production
  DEBUG: "false"
  LOG_LEVEL: INFO
  BASE_URL: https://api.talento.uz
  FRONTEND_URL: https://app.talento.uz
  CORS_ORIGINS: '["https://app.talento.uz"]'
  DATABASE_URL: postgresql+asyncpg://talento:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/talento
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  BOT_TOKEN_ENCRYPTION_KEY: ${BOT_TOKEN_ENCRYPTION_KEY:?BOT_TOKEN_ENCRYPTION_KEY is required}
  PLATFORM_BOT_TOKEN: ${PLATFORM_BOT_TOKEN:-}
  PLATFORM_BOT_USERNAME: ${PLATFORM_BOT_USERNAME:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_BUCKET: ${S3_BUCKET:-talento}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  LOCAL_UPLOAD_DIR: /app/uploads
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: talento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: talento
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talento -d talento"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    logging: *default-logging

  migrate:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
      - --proxy-headers
      - --forwarded-allow-ips=*
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_BIND_PORT:-18000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    pids_limit: 300
    mem_limit: 1024m
    init: true
    logging: *default-logging

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    pids_limit: 300
    mem_limit: 768m
    init: true
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_BIND_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 192m
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  uploads:
