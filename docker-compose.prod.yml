# Production overlay. Adds Caddy (automatic TLS), drops dev bind-mounts and hot reload.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Set DOMAIN and ACME_EMAIL in .env; Caddy obtains and renews the certificate itself, so
# BASE_URL can point straight at https://$DOMAIN and Telegram's webhook requirement is met.

services:
  db:
    ports: []
    restart: unless-stopped

  redis:
    ports: []
    restart: unless-stopped

  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - uploads:/app/uploads
    ports: []
    environment:
      ENV: production
      DEBUG: "false"
    restart: unless-stopped

  worker:
    volumes:
      - uploads:/app/uploads
    environment:
      ENV: production
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    volumes: []
    ports: []
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
